name: Build Musafir APK v11

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Create Cordova Project
        run: |
          cordova create musafir_app com.musafir.game Musafir
          cd musafir_app
          cordova platform add android@12.0.1

      - name: Copy Game File
        run: cp game/index.html musafir_app/www/index.html

      - name: Fix XmlParser error in cordova.gradle
        run: |
          # Add the missing import for Groovy 4 compatibility
          FILE="musafir_app/platforms/android/CordovaLib/cordova.gradle"
          sed -i '1i import groovy.xml.XmlParser' $FILE
          echo "Fixed cordova.gradle with import"

      - name: Build APK
        run: |
          cd musafir_app
          cordova build android --debug

      - name: Copy APK to root
        run: cp musafir_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk Musafir_Game.apk

      - name: Release APK
        run: |
          gh release delete v1.0 --yes 2>/dev/null || true
          gh release create v1.0 Musafir_Game.apk --title "Musafir Game v1.0" --notes "Finally! The APK is ready. Download and enjoy the journey of Musafir."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
