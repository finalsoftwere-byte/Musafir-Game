name: Build Musafir APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v3

      - name: Setup Java 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Node.js 16
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install Cordova 11
        run: npm install -g cordova@11

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Create Cordova Project
        run: |
          cordova create musafir_app com.musafir.game Musafir
          cd musafir_app
          cordova platform add android@11

      - name: Copy Game HTML
        run: cp game/index.html musafir_app/www/index.html

      - name: Write Cordova config
        run: |
          cat > musafir_app/config.xml << 'CFGEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <widget id="com.musafir.game" version="1.0.0" xmlns="http://www.w3.org/ns/widgets">
            <name>Musafir</name>
            <description>Road Adventure Game</description>
            <author>finalsoftwere-byte</author>
            <content src="index.html" />
            <preference name="android-minSdkVersion" value="22" />
            <preference name="android-targetSdkVersion" value="32" />
            <preference name="Fullscreen" value="true" />
            <preference name="Orientation" value="portrait" />
          </widget>
          CFGEOF

      - name: Force Gradle 7.6
        run: |
          cd musafir_app/platforms/android
          ./gradlew wrapper --gradle-version 7.6

      - name: Build Debug APK
        run: |
          cd musafir_app
          cordova build android --debug

      - name: Copy APK
        run: cp musafir_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk Musafir_Game.apk

      - name: Delete old release
        run: gh release delete v1.0 --yes 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        run: gh release create v1.0 Musafir_Game.apk --title "Musafir Game v1.0" --notes "Download and Install APK!"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
