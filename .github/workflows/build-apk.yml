name: Build Musafir APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Create Cordova Project
        run: |
          cordova create musafir_app com.musafir.game Musafir
          cd musafir_app
          cordova platform add android@12

      - name: Copy Game File
        run: cp game/index.html musafir_app/www/index.html

      - name: Write config.xml
        run: |
          cat > musafir_app/config.xml << 'CFGEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <widget id="com.musafir.game" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
            <name>Musafir</name>
            <description>Road Adventure Game</description>
            <author>finalsoftwere-byte</author>
            <content src="index.html" />
            <allow-intent href="http://*/*" />
            <allow-intent href="https://*/*" />
            <preference name="android-minSdkVersion" value="22" />
            <preference name="android-targetSdkVersion" value="34" />
            <preference name="Fullscreen" value="true" />
            <preference name="Orientation" value="portrait" />
            <preference name="DisallowOverscroll" value="true" />
          </widget>
          CFGEOF

      - name: Build Debug APK
        run: |
          cd musafir_app
          cordova build android --debug

      - name: Copy APK to root
        run: |
          cp musafir_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk Musafir_Game.apk
          echo "APK ready: $(du -sh Musafir_Game.apk)"

      - name: Delete old release
        run: gh release delete v1.0 --yes 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK to GitHub Release
        run: gh release create v1.0 Musafir_Game.apk --title "Musafir Game v1.0" --notes "Download APK and install on your Android phone!"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
